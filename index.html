<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Timeline</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Timeline" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #86868b;
    --line: #d2d2d7;
    --accent: #1d1d1f;
    --today: #0071e3;
    --surface: #ffffff;
    --input: #fbfbfd;
    --chip: #e8e8ed;
    --pill: rgba(255, 255, 255, 0.72);
    --del-bg: #ffe5e5;
    --del-fg: #d70015;
    --wp-opacity: 0.08;
    --maxScale: 1.9;
    --minScale: 0.62;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #8e8e93;
      --line: #3a3a3c;
      --accent: #f5f5f7;
      --today: #0a84ff;
      --surface: #1c1c1e;
      --input: #2c2c2e;
      --chip: #2c2c2e;
      --pill: rgba(44, 44, 46, 0.72);
      --del-bg: rgba(255, 69, 58, 0.18);
      --del-fg: #ff453b;
      --wp-opacity: 0.1;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    overflow-y: scroll;
    scroll-snap-type: y proximity;
    overscroll-behavior: none;
    color-scheme: light dark;
  }

  /* Faint full-screen background wallpaper (set via JS if the image exists) */
  .wallpaper {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: var(--wp-opacity, 0.08);
    pointer-events: none;
  }

  /* The single vertical line, fixed in the middle of the screen */
  .rail {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    transform: translateX(-50%);
    background: linear-gradient(
      to bottom,
      transparent 0%,
      var(--line) 12%,
      var(--line) 88%,
      transparent 100%
    );
    z-index: 0;
    pointer-events: none;
  }

  .events {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15vh;
    padding: 50vh 0;
    width: 100%;
  }

  .event {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    scroll-snap-align: center;
    transform-origin: center center;
    will-change: transform, opacity;
    cursor: pointer;
    user-select: none;
  }

  .event .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--cat, var(--accent));
    /* ring in page colour visually breaks the rail so dots read as beads */
    box-shadow: 0 0 0 7px var(--bg);
    transition: box-shadow 0.2s ease;
  }

  .event .card {
    background: var(--bg);
    padding: 4px 22px;
    border-radius: 16px;
    text-align: center;
    white-space: nowrap;
  }

  .event .countdown {
    display: none;
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--today);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }

  .event .date {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.15;
  }

  .event .year {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--muted);
    margin-top: 2px;
  }

  .event .title {
    margin-top: 6px;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .event .location {
    margin-top: 1px;
    padding: 3px 9px;
    border-radius: 9px;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .event .location svg { flex: none; opacity: 0.9; }
  .event .location:active { background: var(--chip); }
  .event.is-active .location { color: var(--today); }

  .event .meta {
    margin-top: 9px;
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .event .meta span {
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }

  /* Centred event: show countdown, ring the dot in its category colour */
  .event.is-active .countdown { display: block; }
  .event.is-active .dot { box-shadow: 0 0 0 7px var(--bg), 0 0 0 9px var(--cat, var(--accent)); }

  /* Past events are de-emphasised */
  .event.is-past .date,
  .event.is-past .title { color: var(--muted); }
  .event.is-past .countdown { color: var(--muted); }

  /* TODAY marker on the rail (does not magnify) */
  .today-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
    scroll-snap-align: center;
  }
  .today-marker .tdot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--today);
    box-shadow: 0 0 0 7px var(--bg), 0 0 0 9px rgba(0, 113, 227, 0.22);
  }
  .today-marker .tlabel {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--today);
    background: var(--bg);
    padding: 3px 12px;
    border-radius: 999px;
  }

  .empty {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1rem;
    z-index: 1;
    pointer-events: none;
  }
  .empty[hidden] { display: none; }

  /* Category filter bar, top-left */
  .filters {
    position: fixed;
    top: 24px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 58vw;
  }
  .filters .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s ease;
    background: var(--pill);
  }
  .filters .pill .swatch { width: 9px; height: 9px; border-radius: 50%; }
  .filters .pill.off { opacity: 0.34; }

  /* Add button, top-right */
  .add-btn {
    position: fixed;
    top: 22px;
    right: 24px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-size: 26px;
    line-height: 1;
    font-weight: 300;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 3px;
  }
  .add-btn:hover { transform: scale(1.07); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
  .add-btn:active { transform: scale(0.96); }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    width: min(92vw, 400px);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 26px 24px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
  }
  .modal h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field label .opt { text-transform: none; font-weight: 400; }
  .field input,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--input);
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .field select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2386868b' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 32px;
  }
  .field input:focus,
  .field select:focus { border-color: #0071e3; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .actions button {
    flex: 1;
    padding: 11px 0;
    border-radius: 11px;
    font-size: 0.95rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s ease;
  }
  .actions button:hover { opacity: 0.85; }
  .btn-delete { background: var(--del-bg); color: var(--del-fg); flex: 0 0 auto; padding-left: 16px; padding-right: 16px; }
  .btn-cancel { background: var(--chip); color: var(--ink); }
  .btn-save { background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="rail"></div>

  <div class="filters" id="filters"></div>
  <button class="add-btn" id="addBtn" title="Add event" aria-label="Add event">+</button>

  <div class="events" id="events"></div>
  <div class="empty" id="empty" hidden>No events yet — tap + to add one</div>

  <div class="overlay" id="overlay">
    <form class="modal" id="form">
      <h2 id="modalTitle">Add event</h2>

      <div class="field">
        <label for="title">Event</label>
        <input id="title" type="text" placeholder="e.g. SCCA Laguna Seca" required />
      </div>

      <div class="field">
        <label for="location">Location <span class="opt">(optional)</span></label>
        <input id="location" type="text" placeholder="e.g. Monterey, California" />
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category"></select>
      </div>

      <div class="row">
        <div class="field">
          <label for="start">Start date</label>
          <input id="start" type="date" required />
        </div>
        <div class="field">
          <label for="end">End date <span class="opt">(optional)</span></label>
          <input id="end" type="date" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="repeat">Repeat</label>
          <select id="repeat">
            <option value="none">Does not repeat</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="yearly">Every year</option>
          </select>
        </div>
        <div class="field">
          <label for="remind">Remind</label>
          <select id="remind">
            <option value="none">None</option>
            <option value="at">At start time</option>
            <option value="1h">1 hour before</option>
            <option value="1d">1 day before</option>
            <option value="1w">1 week before</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="notes">Notes <span class="opt">(optional)</span></label>
        <input id="notes" type="text" placeholder="Anything to remember" />
      </div>

      <div class="actions">
        <button type="button" class="btn-delete" id="deleteBtn" hidden>Delete</button>
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save" id="saveBtn">Add</button>
      </div>
    </form>
  </div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "timeline.events.v1";
  var FIRED_KEY = "timeline.firedReminders.v1";
  var HIDDEN_KEY = "timeline.hiddenCats.v1";
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  var CATS = {
    general:  { name: "General",  color: "#8e8e93" },
    racing:   { name: "Racing",   color: "#ff3b30" },
    expo:     { name: "Expo",     color: "#0071e3" },
    personal: { name: "Personal", color: "#34c759" },
    travel:   { name: "Travel",   color: "#ff9500" }
  };
  function cat(key) { return CATS[key] || CATS.general; }

  var REPEAT_CHIP = { weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };
  var REMIND_CHIP = { at: "Remind at start", "1h": "Remind 1h", "1d": "Remind 1d", "1w": "Remind 1w" };
  var REMIND_MS = { at: 0, "1h": 3600e3, "1d": 86400e3, "1w": 604800e3 };

  var SEED = [
    { title: "Thunderhill",      location: "Willows, California",  category: "racing", start: "2026-05-28", end: "2026-05-30" },
    { title: "Flight Sim Expo",  location: "Las Vegas, Nevada",    category: "expo",   start: "2026-06-12", end: "2026-06-14" },
    { title: "SCCA Laguna Seca", location: "Monterey, California", category: "racing", start: "2026-06-26", end: ""           }
  ];

  // DOM refs
  var eventsEl   = document.getElementById("events");
  var emptyEl    = document.getElementById("empty");
  var filtersEl  = document.getElementById("filters");
  var overlay    = document.getElementById("overlay");
  var form       = document.getElementById("form");
  var modalTitle = document.getElementById("modalTitle");
  var saveBtn    = document.getElementById("saveBtn");
  var deleteBtn  = document.getElementById("deleteBtn");
  var fTitle     = document.getElementById("title");
  var fLocation  = document.getElementById("location");
  var fCategory  = document.getElementById("category");
  var fStart     = document.getElementById("start");
  var fEnd       = document.getElementById("end");
  var fRepeat    = document.getElementById("repeat");
  var fRemind    = document.getElementById("remind");
  var fNotes     = document.getElementById("notes");

  var events = normalizeAll(load());
  var hiddenCats = loadHidden();      // { catKey: true } => hidden
  var nodes = [];                     // .event elements, parallel to `visible`
  var visible = [];                   // events currently shown (after filter), sorted
  var firstUpcomingIdx = 0;           // index in `visible` of first ongoing/upcoming event
  var editingId = null;

  // populate the category <select>
  Object.keys(CATS).forEach(function (key) {
    var o = document.createElement("option");
    o.value = key;
    o.textContent = CATS[key].name;
    fCategory.appendChild(o);
  });

  function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function normalize(ev) {
    return {
      id: ev.id || uid(),
      title: ev.title || "",
      location: ev.location || "",
      category: CATS[ev.category] ? ev.category : "general",
      start: ev.start,
      end: ev.end || "",
      repeat: ev.repeat || "none",
      remind: ev.remind || "none",
      notes: ev.notes || ""
    };
  }
  function normalizeAll(list) { return (list || []).map(normalize); }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SEED.slice();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(events)); } catch (e) {}
  }
  function loadHidden() {
    try { return JSON.parse(localStorage.getItem(HIDDEN_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveHidden() {
    try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(hiddenCats)); } catch (e) {}
  }

  function findById(id) {
    for (var i = 0; i < events.length; i++) if (events[i].id === id) return events[i];
    return null;
  }

  function parseDate(s) { return new Date(s + "T00:00:00"); }
  function todayMs() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function formatDate(start, end) {
    var s = parseDate(start);
    if (!end || end === start) {
      return MONTHS[s.getMonth()] + " " + s.getDate();
    }
    var e = parseDate(end);
    if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
      return MONTHS[s.getMonth()] + " " + s.getDate() + "–" + e.getDate();
    }
    return MONTHS[s.getMonth()] + " " + s.getDate() + " – " + MONTHS[e.getMonth()] + " " + e.getDate();
  }

  function humanSpan(d) {
    if (d <= 1) return "1 day";
    if (d < 14) return d + " days";
    if (d < 60) return Math.round(d / 7) + " weeks";
    return Math.round(d / 30) + " months";
  }
  function relativeText(ev) {
    var today = todayMs();
    var start = parseDate(ev.start).getTime();
    var end = parseDate(ev.end || ev.start).getTime();
    if (today < start) {
      var dUp = Math.round((start - today) / 86400e3);
      return dUp === 1 ? "Tomorrow" : "in " + humanSpan(dUp);
    }
    if (today > end) {
      var dPast = Math.round((today - end) / 86400e3);
      return dPast === 1 ? "Yesterday" : humanSpan(dPast) + " ago";
    }
    return (ev.end && ev.end !== ev.start) ? "Happening now" : "Today";
  }
  function isPast(ev) { return parseDate(ev.end || ev.start).getTime() < todayMs(); }

  // Google Maps search link. Combine title + location so a venue like
  // "SCCA Laguna Seca" + "Monterey, California" resolves to the track.
  function mapsUrl(ev) {
    var q = [ev.title, ev.location].filter(Boolean).join(" ");
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  // Live ticking countdown for the centred event
  function countdownText(ev) {
    var now = Date.now();
    var start = parseDate(ev.start).getTime();
    var endDay = parseDate(ev.end || ev.start).getTime() + 86400e3 - 1000;
    if (now < start) {
      var s = Math.floor((start - now) / 1000);
      var d = Math.floor(s / 86400); s %= 86400;
      var h = Math.floor(s / 3600); s %= 3600;
      var m = Math.floor(s / 60); s %= 60;
      return (d > 0 ? d + "d " : "") + pad2(h) + ":" + pad2(m) + ":" + pad2(s);
    }
    if (now <= endDay) return "Happening now";
    return relativeText(ev);
  }
  function updateActiveCountdown() {
    var el = eventsEl.querySelector(".event.is-active");
    if (!el) return;
    var ev = findById(el.dataset.id);
    var cd = el.querySelector(".countdown");
    if (ev && cd) cd.textContent = countdownText(ev);
  }
  setInterval(updateActiveCountdown, 1000);

  // ---- Filter bar -------------------------------------------------------
  function renderFilters() {
    filtersEl.innerHTML = "";
    var used = {};
    events.forEach(function (ev) { used[ev.category] = true; });
    var keys = Object.keys(CATS).filter(function (k) { return used[k]; });
    if (keys.length < 2) return; // nothing meaningful to filter

    keys.forEach(function (key) {
      var c = cat(key);
      var pill = document.createElement("div");
      pill.className = "pill" + (hiddenCats[key] ? " off" : "");
      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = c.color;
      var label = document.createElement("span");
      label.textContent = c.name;
      pill.appendChild(sw);
      pill.appendChild(label);
      pill.addEventListener("click", function () {
        if (hiddenCats[key]) delete hiddenCats[key]; else hiddenCats[key] = true;
        saveHidden();
        renderFilters();
        render();
      });
      filtersEl.appendChild(pill);
    });
  }

  // ---- Render timeline --------------------------------------------------
  function render() {
    visible = events
      .filter(function (ev) { return !hiddenCats[ev.category]; })
      .sort(function (a, b) { return parseDate(a.start) - parseDate(b.start); });

    eventsEl.innerHTML = "";
    nodes = [];

    var currentYear = new Date().getFullYear();
    var today = todayMs();
    firstUpcomingIdx = visible.findIndex(function (ev) {
      return parseDate(ev.end || ev.start).getTime() >= today;
    });
    if (firstUpcomingIdx < 0) firstUpcomingIdx = visible.length;

    var todayMarker = makeTodayMarker();

    visible.forEach(function (ev, i) {
      if (i === firstUpcomingIdx) eventsEl.appendChild(todayMarker);
      eventsEl.appendChild(buildEvent(ev, currentYear));
    });
    if (firstUpcomingIdx >= visible.length) eventsEl.appendChild(todayMarker);

    emptyEl.hidden = events.length > 0;
    requestUpdate();
  }

  function makeTodayMarker() {
    var m = document.createElement("div");
    m.className = "today-marker";
    var dot = document.createElement("div");
    dot.className = "tdot";
    var label = document.createElement("div");
    label.className = "tlabel";
    label.textContent = "TODAY · " + formatDate(new Date(todayMs()).toISOString().slice(0, 10), "");
    m.appendChild(dot);
    m.appendChild(label);
    return m;
  }

  function buildEvent(ev, currentYear) {
    var c = cat(ev.category);
    var el = document.createElement("div");
    el.className = "event" + (isPast(ev) ? " is-past" : "");
    el.dataset.id = ev.id;
    el.style.setProperty("--cat", c.color);
    el.addEventListener("click", function (e) {
      // Don't open the editor when a link inside the card (e.g. the map
      // location, including its pin icon) is tapped.
      if (e.target.closest && e.target.closest("a")) return;
      openEdit(ev.id);
    });

    var dot = document.createElement("div");
    dot.className = "dot";

    var card = document.createElement("div");
    card.className = "card";

    var countdown = document.createElement("div");
    countdown.className = "countdown";
    countdown.textContent = relativeText(ev);
    card.appendChild(countdown);

    var date = document.createElement("div");
    date.className = "date";
    date.textContent = formatDate(ev.start, ev.end);
    card.appendChild(date);

    var yr = parseDate(ev.start).getFullYear();
    if (yr !== currentYear) {
      var year = document.createElement("div");
      year.className = "year";
      year.textContent = yr;
      card.appendChild(year);
    }

    var title = document.createElement("div");
    title.className = "title";
    title.textContent = ev.title;
    card.appendChild(title);

    if (ev.location) {
      var loc = document.createElement("a");
      loc.className = "location";
      loc.href = mapsUrl(ev);
      loc.target = "_blank";
      loc.rel = "noopener noreferrer";
      loc.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>';
      loc.appendChild(document.createTextNode(ev.location));
      loc.addEventListener("click", function (e) { e.stopPropagation(); });
      card.appendChild(loc);
    }

    var chips = [];
    if (ev.category && ev.category !== "general") chips.push({ text: c.name, color: c.color });
    if (ev.repeat && REPEAT_CHIP[ev.repeat]) chips.push({ text: REPEAT_CHIP[ev.repeat] });
    if (ev.remind && REMIND_CHIP[ev.remind]) chips.push({ text: REMIND_CHIP[ev.remind] });
    if (chips.length) {
      var meta = document.createElement("div");
      meta.className = "meta";
      chips.forEach(function (ch) {
        var span = document.createElement("span");
        span.textContent = ch.text;
        if (ch.color) { span.style.color = ch.color; span.style.borderColor = ch.color; }
        meta.appendChild(span);
      });
      card.appendChild(meta);
    }

    el.appendChild(dot);
    el.appendChild(card);
    nodes.push(el);
    return el;
  }

  // ---- Dock magnification ----------------------------------------------
  var ticking = false;

  function requestUpdate() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  function update() {
    ticking = false;
    var center = window.innerHeight / 2;
    var R = window.innerHeight * 0.55; // influence radius
    var styles = getComputedStyle(document.documentElement);
    var maxScale = parseFloat(styles.getPropertyValue("--maxScale")) || 1.9;
    var minScale = parseFloat(styles.getPropertyValue("--minScale")) || 0.62;

    var closest = null;
    var closestDist = Infinity;

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var rect = el.getBoundingClientRect();
      var elCenter = rect.top + rect.height / 2;
      var dist = Math.abs(elCenter - center);

      // Smooth cosine falloff: 1 at centre, 0 beyond radius R
      var t = Math.min(dist, R) / R;
      var falloff = (Math.cos(t * Math.PI) + 1) / 2;

      var scale = minScale + (maxScale - minScale) * falloff;
      var opacity = 0.22 + 0.78 * falloff;
      if (el.classList.contains("is-past")) opacity *= 0.5;

      el.style.transform = "scale(" + scale.toFixed(3) + ")";
      el.style.opacity = opacity.toFixed(3);
      el.style.zIndex = String(Math.round(falloff * 100));

      if (dist < closestDist) { closestDist = dist; closest = el; }
    }

    for (var j = 0; j < nodes.length; j++) {
      nodes[j].classList.toggle("is-active", nodes[j] === closest);
    }
    updateActiveCountdown();
  }

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);

  // ---- Add / edit modal -------------------------------------------------
  function fillForm(ev) {
    fTitle.value    = ev ? ev.title : "";
    fLocation.value = ev ? ev.location : "";
    fCategory.value = ev ? ev.category : "general";
    fStart.value    = ev ? ev.start : "";
    fEnd.value      = ev ? ev.end : "";
    fRepeat.value   = ev ? ev.repeat : "none";
    fRemind.value   = ev ? ev.remind : "none";
    fNotes.value    = ev ? ev.notes : "";
  }

  function openAdd() {
    editingId = null;
    modalTitle.textContent = "Add event";
    saveBtn.textContent = "Add";
    deleteBtn.hidden = true;
    fillForm(null);
    overlay.classList.add("open");
    fTitle.focus();
  }

  function openEdit(id) {
    var ev = findById(id);
    if (!ev) return;
    editingId = id;
    modalTitle.textContent = "Edit event";
    saveBtn.textContent = "Save";
    deleteBtn.hidden = false;
    fillForm(ev);
    overlay.classList.add("open");
    fTitle.focus();
  }

  function closeModal() {
    overlay.classList.remove("open");
    editingId = null;
    form.reset();
  }

  document.getElementById("addBtn").addEventListener("click", openAdd);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  deleteBtn.addEventListener("click", function () {
    if (!editingId) return;
    events = events.filter(function (ev) { return ev.id !== editingId; });
    save();
    renderFilters();
    render();
    closeModal();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = fTitle.value.trim();
    var start = fStart.value;
    if (!title || !start) return;

    var end = fEnd.value;
    if (end && parseDate(end) < parseDate(start)) end = start;

    var fields = {
      title: title,
      location: fLocation.value.trim(),
      category: fCategory.value,
      start: start,
      end: end,
      repeat: fRepeat.value,
      remind: fRemind.value,
      notes: fNotes.value.trim()
    };

    var savedId;
    if (editingId) {
      var ev = findById(editingId);
      if (ev) {
        ev.title = fields.title; ev.location = fields.location; ev.category = fields.category;
        ev.start = fields.start; ev.end = fields.end;
        ev.repeat = fields.repeat; ev.remind = fields.remind; ev.notes = fields.notes;
      }
      savedId = editingId;
    } else {
      var fresh = normalize(fields);
      events.push(fresh);
      savedId = fresh.id;
    }

    save();
    maybeRequestNotify(fields.remind);
    renderFilters();
    render();
    closeModal();
    scrollToId(savedId);
    checkReminders();
  });

  // Bring an event to the centre of the screen
  function scrollToId(id) {
    var el = nodes.filter(function (n) { return n.dataset.id === id; })[0];
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // ---- Reminders (best-effort while the page is open) -------------------
  function loadFired() {
    try { return JSON.parse(localStorage.getItem(FIRED_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveFired(obj) {
    try { localStorage.setItem(FIRED_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function maybeRequestNotify(remind) {
    if (remind && remind !== "none" && "Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }
  function showNote(title, body) {
    var opts = { body: body, icon: "icon-192.png", badge: "icon-192.png", tag: "timeline" };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(function (reg) { reg.showNotification(title, opts); });
        return;
      }
    } catch (e) {}
    try { new Notification(title, opts); } catch (e) {}
  }
  function checkReminders() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var now = Date.now();
    var fired = loadFired();
    var changed = false;

    events.forEach(function (ev) {
      if (!ev.remind || ev.remind === "none") return;
      var off = REMIND_MS[ev.remind];
      if (off == null) return;
      var startMs = parseDate(ev.start).getTime();
      var when = startMs - off;
      var key = ev.id + ":" + ev.remind + ":" + ev.start;
      if (now >= when && now <= startMs + 86400e3 && !fired[key]) {
        showNote(ev.title || "Event", formatDate(ev.start, ev.end) + (ev.location ? " · " + ev.location : ""));
        fired[key] = true;
        changed = true;
      }
    });

    if (changed) saveFired(fired);
  }
  setInterval(checkReminders, 30000);

  // ---- Boot -------------------------------------------------------------
  // Full PWA (offline) on a real origin like GitHub Pages. On third-party
  // render proxies (githack/jsDelivr/etc.) skip and clean up any worker so
  // a cached scope can't leave the page in a broken state.
  if ("serviceWorker" in navigator) {
    var onProxy = /githack|jsdelivr|statically|githubusercontent|htmlpreview/.test(location.host);
    if (onProxy) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    } else {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  }

  // Optional faint background: drop wallpaper.jpg/.png/.webp next to
  // index.html and it shows behind everything at --wp-opacity.
  (function loadWallpaper() {
    var el = document.getElementById("wallpaper");
    if (!el) return;
    var names = ["wallpaper.jpg", "wallpaper.png", "wallpaper.webp"];
    (function tryNext(i) {
      if (i >= names.length) return;
      var img = new Image();
      img.onload = function () { el.style.backgroundImage = "url('" + names[i] + "')"; };
      img.onerror = function () { tryNext(i + 1); };
      img.src = names[i];
    })(0);
  })();

  renderFilters();
  render();
  checkReminders();

  // Open centred on the first upcoming event
  (function initialScroll() {
    if (!nodes.length) return;
    var idx = Math.min(firstUpcomingIdx, nodes.length - 1);
    requestAnimationFrame(function () {
      nodes[idx].scrollIntoView({ block: "center", inline: "nearest" });
      requestUpdate();
    });
  })();
})();
</script>
</body>
</html>
